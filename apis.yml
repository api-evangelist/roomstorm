name: Roomstorm
description: >-
  Roomstorm is a real-time B2B hotel room marketplace, best known for building the
  airline industry's first fully automated platform for providing hotel accommodations
  to distressed passengers during flight disruptions. Founded by Maksim Izmaylov and
  backed by Y Combinator (Summer 2014), the San Francisco company connects airlines,
  hotels, and travelers so that irregular-operations (IROPS) rebooking, room sourcing,
  invoicing, and voucher issuance happen programmatically instead of through manual
  phone calls. Its backend exposes a JSON REST API (documented in API Blueprint)
  covering authentication, bookings, hotels, rooms, vacancies, organizations, vouchers,
  and airport search.
