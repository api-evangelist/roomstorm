apis:
- name: Roomstorm API
  description: >-
    Roomstorm's B2B hotel-room marketplace REST API (Django REST framework backend).
    Documented in API Blueprint, it covers a bootstrap discovery endpoint, JWT
    username/password authentication, hotel search by geo/airport, vacancy and room
    pricing, bookings and sold-rooms, organizations, vouchers, and guest/airline buy
    flows. Collection endpoints support page_size pagination via X-Total-Count and
    Link headers.
